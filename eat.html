<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>食堂窗口抽取器 · Lawrenclia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>

    * { 
            box-sizing: border-box; 
        }
    
    /* --- 这里是主要修改 --- */
    :root {
      --accent: #ff6b9a;
      /* 使用柔和的蓝白渐变 */
      --background: linear-gradient(135deg, #f5f7fa 0%, #d6e3f3 100%);
      --text: #111;
      --card-bg: #fff;
      --card-shadow: 0 6px 16px rgba(16,24,40,0.06);
      --muted: #666;
      --border: rgba(0,0,0,0.08);
      --link: #0066cc;

      /* 导航栏专属变量 */
      --nav-bg: rgba(255, 255, 255, 0.6);
      --nav-text: #1d1d1f;
      --nav-link-hover-bg: rgba(0, 0, 0, 0.03);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --nav-hover-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

    }

    /* 深色主题变量 */
    .dark-theme {
      /* 使用深空紫渐变 */
      --background: linear-gradient(135deg, #2b273b 0%, #1e1c28 100%);
      --text: #f0f0f0;
      --card-bg: #2d2d2d;
      --card-shadow: 0 6px 16px rgba(0,0,0,0.3);
      --muted: #bbb;
      --border: rgba(255,255,255,0.1);
      --link: #66b2ff;

      /* 导航栏专属变量 */
      --nav-bg: rgba(30, 30, 30, 0.7);
      --nav-text: #f0f0f0;
      --nav-link-hover-bg: rgba(255, 255, 255, 0.05);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      --nav-hover-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    /* --- 修改结束 --- */


   body{
      margin:0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:var(--background);
      color:var(--text);
      line-height:1.6;
      transition: background-color 0.3s ease;
      
      display: flex;
      flex-direction: column;
      min-height: 100vh; 
    }
    /* =========================
        2. 顶部导航栏
    ========================= */
    .navbar{
        height: 54px;
        display:flex;
        align-items:center;
        justify-content:center;
        position:fixed; 
        top:16px; 
        left:50%; 
        transform:translateX(-50%);
        z-index:30; 
        width:min(800px,calc(100% - 40px));
        background: var(--nav-bg);
        border-radius: 18px;
        padding: 0 28px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border:1px solid var(--border);
        box-shadow: var(--nav-shadow);
        transition: all 0.3s ease;
        overflow: hidden;
    }

    .dark-theme .navbar {
        background: var(--nav-bg); 
    }

    .navbar:hover {
        box-shadow: var(--nav-hover-shadow); 
    }

    .dark-theme .navbar:hover {
        box-shadow: var(--nav-hover-shadow); 
    }

    .nav-left{display:flex;align-items:center;gap:12px;margin-right: auto;}
    .brand{
        font-weight:600; 
        font-size:20px; 
        letter-spacing:0.2px;
        color: var(--text);
        display:flex; 
        align-items:center; 
        gap:10px;
    }
    .brand .logo{
        width:28px;
        height:28px;
        border-radius:8px; 
        background: var(--accent);
        display:inline-grid;
        place-items:center;
        font-weight:600;
        color:#fff;
        font-size:14px;
        box-shadow: 0 2px 10px rgba(255, 107, 154, 0.3);
    }
    .nav-center{
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .nav-link{
        padding:8px 12px; 
        border-radius:10px; 
        font-weight:400;
        font-size:14px; 
        color: var(--muted);
        text-decoration:none; 
        transition: all .2s ease;
        position: relative;
        overflow: hidden;
    }
    .nav-link:hover{ 
        color:var(--text); 
        background: var(--nav-link-hover-bg); 
        transform: translateY(-1px);
    }

    .dark-theme .nav-link:hover {
        background: var(--nav-link-hover-bg); 
    }

    .nav-link::after {
        content: '';
        position: absolute;
        bottom: 6px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--accent);
        transition: all 0.3s ease;
        transform: translateX(-50%);
    }
    .nav-link:hover::after {
        width: 60%;
    }
    .theme-toggle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    .theme-toggle:hover {
        background: rgba(0, 0, 0, 0.05);
        transform: rotate(90deg);
    }

    .dark-theme .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto; 
      padding: 80px 20px 40px 20px; 
      
      flex-grow: 1; 
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;   
    }

    /* =========================
        食堂抽取器专属样式
    ========================= */
    
    .picker-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      
      /* 注意：这里的背景色来自变量，在暗色模式下会改变 */
      background: var(--nav-bg); /* 复用导航栏的毛玻璃背景 */
      
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      
      text-align: center;
      padding: 40px 30px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      
      /* 固定宽度 */
      width: 500px; 
      max-width: 100%; 
      
      margin: 0; 
    }
    
    /* 深色模式下的卡片，复用变量 */
    .dark-theme .picker-card {
      background: var(--nav-bg); 
      border: 1px solid var(--border); 
      box-shadow: var(--card-shadow); 
    }

    .picker-card h2 {
      margin-top: 0;
      color: var(--text);
      font-size: 24px; 
      font-weight: 600;
      margin-bottom: 20px;
    }
    
    #result {
        font-size: 1.8em;
        font-weight: bold;
        color: var(--link); 
        height: 100px; /* 固定高度防止跳动 */
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
        transition: transform 0.1s ease-out;
        line-height: 1.4; 
    }
    
    #result p {
        margin: 0;
    }
    
    #draw-button {
        font-size: 1.2em;
        padding: 12px 25px;
        color: #fff;
        background: var(--accent); 
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(255, 107, 154, 0.3);
    }

    #draw-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(255, 107, 154, 0.4);
    }

    #draw-button:active {
        transform: scale(0.98) translateY(-1px);
    }
    

    /* =========================
        页脚 (来自 project.html)
    ========================= */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 30px 10px;
      border-top: 1px solid var(--border);
    }
  
    /* =========================
        响应式 (来自 project.html)
    ========================= */
    @media (max-width: 600px) {
        .navbar {
            padding: 0 10px;
            height: 48px;
        }
        .nav-center {
            gap: 8px;
        }
        .brand div:first-of-type + div {
            font-size: 11px; 
        }
        .nav-link {
            font-size: 11px; 
            padding: 6px 6px;
        }
        footer {
            font-size: 12px; 
        }
        .picker-card {
            padding: 30px 20px;
        }
        .picker-card h2 {
            font-size: 20px;
        }
        
        #result {
            font-size: 1.5em;
            height: 90px; 
        }
        #draw-button {
            font-size: 1.1em;
            padding: 10px 20px;
        }
    }

  </style>
</head>
<body>
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <div style="font-size:16px;font-weight:600">食堂窗口抽取器 · Lawrenclia</div>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="blog.html">博客</a>
            <a class="nav-link" href="message.html">留言</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
  
  <div class="wrap">
      
      <div class="picker-card">
          <h2>今天我们吃什么？</h2>
          
          <div id="result">
              <p>🤔...</p>
          </div>
          
          <button id="draw-button">开饭！</button>
      </div>

  </div>

  <footer>
  </footer>

  <script>
      const canteens = [
          '一餐：川味窗口',
          '一餐：陕西美食 (面)',
          '一餐：养生锅 (飘香鸡锅)',
          '一餐：五芳斋',
          '一餐：糖水粥铺',
          '一餐：自制馄饨',
          '一餐：麻辣烫',
          '一餐：健康窗口',
          '一餐：清真餐厅 (旁边)',
          '一餐：麦当劳 (旁边)',
          '第二餐饮大楼 (二餐)', 
          '三餐一楼：木桶饭',
          '三餐一楼：各类点心',
          '三餐二楼：黄焖鸡',
          '三餐二楼：烤肉饭',
          '三餐二楼：麻辣香锅',
          '三餐二楼：铁板烧',
          '第四餐饮大楼 (四餐)',
          '五餐一楼：东湖面馆',
          '五餐一楼：麻辣香锅',
          '五餐一楼：铁板烧',
          '五餐一楼：刀削面',
          '五餐二楼：无田有果 (火锅)',
          '五餐三楼：吉姆利德 (西餐)',
          '第六餐饮大楼 (六餐)',
          '第七餐饮大楼 (七餐)',
          '玉兰苑一楼：麻辣烫',
          '玉兰苑一楼：鱼粉',
          '玉兰苑一楼：铁板烧',
          '玉兰苑一楼：东北水饺',
          '玉兰苑一楼：木桶饭',
          '玉兰苑二楼：一等茶餐厅',
          '玉兰苑外：饼家 (鸡蛋灌饼)',
          '玉兰苑外：餐堡 (菠萝包)',
          '玉LA苑外：串府',
          '哈乐餐厅'
      ];

      const drawButton = document.getElementById('draw-button');
      const resultDiv = document.getElementById('result');

      drawButton.addEventListener('click', function() {
          const randomIndex = Math.floor(Math.random() * canteens.length);
          const selectedCanteen = canteens[randomIndex];
          resultDiv.innerHTML = `<p>${selectedCanteen}</p>`;
          resultDiv.style.transform = 'scale(1.1)';
          setTimeout(() => {
              resultDiv.style.transform = 'scale(1)';
          }, 100);
      });
  </script>

  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
  </script>

</body>
</html>
