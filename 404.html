</head>
<body class="page-404">
    <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                404 · Lawrenclia
            </div>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="projects.html">项目</a>

            <!-- <a class="nav-link" href="message.html">留言</a> -->
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="wrap" id="wrap">
        <div class="card" role="main">
            <div class="content-404">
                <h1>404</h1>
                <p>抱歉，这个页面走丢了喵~</p>
                <a href="index.html">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        function isMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }
        async function fetchRandomBackground(){
            const pcSources = [ 'https://www.loliapi.com/acg/?t=', 'https://api.mtyqx.cn/tapi/random.php?=', 'https://acg.suyanw.cn/api.php?=' ];
            const mobileSources = [ 'https://www.loliapi.com/acg/?t=' ];
            const sources = isMobile()? mobileSources : pcSources;
            const idx = Math.floor(Math.random()*sources.length);
            return sources[idx] + Date.now();
        }
        async function setPageBackground() {
            const imageUrl = await fetchRandomBackground();
            const wrapElement = document.getElementById('wrap');
            if (!imageUrl) { wrapElement.style.background = '#f5f5f7'; return; }
            wrapElement.style.setProperty('--random-bg-url', `url('${imageUrl}')`);
        }
        setPageBackground();
        
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          body.classList.add('dark-theme'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
          body.classList.toggle('dark-theme');
          if (body.classList.contains('dark-theme')) { localStorage.setItem('theme', 'dark'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
          else { localStorage.setItem('theme', 'light'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            if (e.matches) { body.classList.add('dark-theme'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
            else { body.classList.remove('dark-theme'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
          }
        });
    </script>

    <div class="svg-filter-container" aria-hidden="true">
        <svg width="0" height="0">
        <filter id="lg-dist">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2" stitchTiles="stitch" />
            <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        </svg>
    </div>

</body>
</html>
