<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 页面未找到 · Lawrenclia的小破站</title>
    <meta name="description" content="你好" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
        
        /* =========================
          404 页面专属样式
        ========================= */
        .content-404 {
            text-align: center;
            padding: 20px 10px;
        }
        .content-404 h1 {
            font-size: 80px;
            margin: 0;
            font-weight: 700;
            color: var(--text); /* 匹配卡片文字颜色 */
            line-height: 1.1;
        }
        .content-404 p {
            margin: 10px 0 30px;
            font-size: 20px;
            color: var(--muted); /* 匹配卡片次要文字颜色 */
            font-weight: 400;
        }
        .content-404 a {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent); /* 匹配 index 强调色 */
            color: white;
            text-decoration: none;
            border-radius: 12px; /* 匹配风格 */
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .content-404 a:hover {
            background: #ff4a83; /* --accent 的深色变体 */
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>
    <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <div style="font-size:16px;font-weight:600">404 · Lawrenclia</div>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="projects.html">项目</a>
            <a class="nav-link" href="blog.html">博客</a>
            <a class="nav-link" href="message.html">留言</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="wrap" id="wrap">
        
        <div class="card" role="main">
            <div class="content-404">
                <h1>404</h1>
                <p>抱歉，这个页面走丢了喵~</p>
                <a href="index.html">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        
        function isMobile(){
        return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        }

        async function fetchRandomBackground(){
        const pcSources = [
            'https://www.loliapi.com/acg/?t=',
            'https://api.mtyqx.cn/tapi/random.php?=',
            'https://acg.suyanw.cn/api.php?=',
        ];
        const mobileSources = [
            'https://www.loliapi.com/acg/?t=',
        ];
        const sources = isMobile()? mobileSources : pcSources;
        const idx = Math.floor(Math.random()*sources.length);
        return sources[idx] + Date.now();
        }

        async function setPageBackground() {
            const imageUrl = await fetchRandomBackground();
            const wrapElement = document.getElementById('wrap');
            if (!imageUrl) {
                wrapElement.style.background = '#f5f5f7';
                return;
            }
            wrapElement.style.setProperty('--random-bg-url', `url('${imageUrl}')`);
        }
        setPageBackground();

        // 主题切换功能 
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          body.classList.add('dark-theme');
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
          body.classList.toggle('dark-theme');
          
          if (body.classList.contains('dark-theme')) {
            localStorage.setItem('theme', 'dark');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
          } else {
            localStorage.setItem('theme', 'light');
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
          }
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            if (e.matches) {
              body.classList.add('dark-theme');
              icon.classList.remove('fa-moon');
              icon.classList.add('fa-sun');
            } else {
              body.classList.remove('dark-theme');
              icon.classList.remove('fa-sun');
              icon.classList.add('fa-moon');
            }
          }
        });
    </script>

</body>
</html>
