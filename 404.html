<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 页面未找到 · Lawrenclia的小破站</title>
    <meta name="description" content="页面未找到" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-404">
    <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                404 · Lawrenclia
            </div>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="projects.html">项目</a>
            <a class="nav-link" href="notes.html">笔记</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="wrap" id="wrap">
        <div class="card" role="main">
            <div class="content-404">
                <h1>404</h1>
                <p>抱歉，这个页面走丢了喵~</p>
                <a href="index.html">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          body.classList.add('dark-theme'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
          body.classList.toggle('dark-theme');
          if (body.classList.contains('dark-theme')) { localStorage.setItem('theme', 'dark'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
          else { localStorage.setItem('theme', 'light'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            if (e.matches) { body.classList.add('dark-theme'); icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
            else { body.classList.remove('dark-theme'); icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
          }
        });
    </script>

</body>
</html>
