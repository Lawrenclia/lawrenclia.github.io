<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/notes-reader.css">
</head>
<body>
  <header class="navbar" role="navigation" aria-label="主导航">
    <div class="nav-left">
      <div class="brand" aria-hidden>
        笔记 · Lawrenclia
      </div>
    </div>
    <div class="nav-right">
      <a class="nav-link" href="index.html">首页</a>
      <a class="nav-link" href="projects.html">项目</a>
      <a class="nav-link" href="notes.html">笔记</a>
      <a class="nav-link" href="about.html">关于</a>
      <button class="theme-toggle" aria-label="切换主题">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <button class="toc-toggle" type="button" aria-label="打开目录" aria-controls="toc-panel" aria-expanded="false">
    <i class="fas fa-list-ul" aria-hidden="true"></i>
  </button>
  <div class="toc-backdrop" hidden></div>

  <div class="layout">
    <aside id="toc-panel" class="toc-panel">
      <h1>目录</h1>
      <p>全部笔记</p>
      <nav>
        <a href="#notes">全部笔记</a>
        <a href="files/notes/abstract-algebra.html">抽象代数</a>
        <a href="files/notes/quantum-physics-review.html">量子物理</a>
        <a href="files/notes/linear-algebra-ii-review.html">线性代数 II</a>
        <a href="files/notes/information-theory-review.html">信息论</a>
        <a href="files/notes/computer-organization-review.html">计算机组成</a>
      </nav>
    </aside>
    <main>
      <div class="hero">
        <h1>课程笔记</h1>
      </div>

      <section id="notes">
        <h2>全部笔记</h2>
        <div class="notes-index">
          <a class="note-row" href="files/notes/abstract-algebra.html">
            <strong>抽象代数</strong>
            <em>打开</em>
          </a>
          <a class="note-row" href="files/notes/quantum-physics-review.html">
            <strong>量子物理复习笔记</strong>
            <em>打开</em>
          </a>
          <a class="note-row" href="files/notes/linear-algebra-ii-review.html">
            <strong>线性代数 II 复习笔记</strong>
            <em>打开</em>
          </a>
          <a class="note-row" href="files/notes/information-theory-review.html">
            <strong>信息论复习笔记</strong>
            <em>打开</em>
          </a>
          <a class="note-row" href="files/notes/computer-organization-review.html">
            <strong>计算机组成复习笔记</strong>
            <em>打开</em>
          </a>
        </div>
      </section>
    </main>
  </div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');

    function updateThemeIcon() {
      if (body.classList.contains('dark-theme')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    }

    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
    }
    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      localStorage.setItem('theme', body.classList.contains('dark-theme') ? 'dark' : 'light');
      updateThemeIcon();
    });

    const tocToggle = document.querySelector(".toc-toggle");
    const tocPanel = document.querySelector(".toc-panel");
    const tocBackdrop = document.querySelector(".toc-backdrop");

    function setTocOpen(open) {
      body.classList.toggle("toc-open", open);
      if (tocToggle) tocToggle.setAttribute("aria-expanded", String(open));
      if (tocBackdrop) tocBackdrop.hidden = !open;
    }

    tocToggle?.addEventListener("click", () => {
      setTocOpen(!body.classList.contains("toc-open"));
    });

    tocBackdrop?.addEventListener("click", () => setTocOpen(false));

    tocPanel?.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.matchMedia("(max-width: 860px)").matches) {
        setTocOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setTocOpen(false);
    });
  </script>
</body>
</html>
