    <script>
        // 判断设备类型
        function isMobile(){
        return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        }

        async function fetchRandomBackground(){
        const pcSources = [
            'https://www.loliapi.com/acg/?t=',
            'https://api.mtyqx.cn/tapi/random.php?=',
            'https://acg.suyanw.cn/api.php?=',
            'http://www.dmoe.cc/random.php?=',  
            'https://acg.suyanw.cn/random.php?=',
            'https://acg.suyanw.cn/api.php?='
        ];
        const mobileSources = [
            'https://www.loliapi.com/acg/?t=',
            'https://acg.suyanw.cn/api.php?=',
        ];
        const sources = isMobile()? mobileSources : pcSources;
        const idx = Math.floor(Math.random()*sources.length);
        return sources[idx] + Date.now();
        }

        // 设置背景图片到 .wrap 的 CSS 变量
        async function setPageBackground() {
            const imageUrl = await fetchRandomBackground();
            const wrapElement = document.getElementById('wrap');
            if (!imageUrl) {
                wrapElement.style.background = '#f5f5f7'; // 苹果风格默认背景
                return;
            }
            wrapElement.style.setProperty('--random-bg-url', `url('${imageUrl}')`);
        }
        setPageBackground();

        // 主题切换功能
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        
        // 检查本地存储中的主题偏好
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          body.classList.add('dark-theme');
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        }
        
        // 切换主题
        themeToggle.addEventListener('click', () => {
          body.classList.toggle('dark-theme');
          
          if (body.classList.contains('dark-theme')) {
            localStorage.setItem('theme', 'dark');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
          } else {
            localStorage.setItem('theme', 'light');
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
          }
        });

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) { // 只有在用户没有手动设置主题时才响应系统变化
            if (e.matches) {
              body.classList.add('dark-theme');
              icon.classList.remove('fa-moon');
              icon.classList.add('fa-sun');
            } else {
              body.classList.remove('dark-theme');
              icon.classList.remove('fa-sun');
              icon.classList.add('fa-moon');
            }
          }
        });
    </script>

    <svg width="0" height="0" style="position: absolute;">
      <filter id="lg-dist">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2" stitchTiles="stitch" />
        <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

</body>
