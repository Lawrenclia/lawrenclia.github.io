    <style>
        /* smooth-zoom.css */
        /* 遮罩层 (背景) */
        .zoom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            z-index: 9998;
        }
        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
            cursor: zoom-out;
        }
        /* 正在放大的克隆图片 */
        .zoom-clone {
            position: fixed;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: zoom-out;
            border: 8px solid rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        /* 原图在被点击时的样式，可选 */
        .post-img-zooming {
            opacity: 0 !important;
        }
    </style>
