    <style>
        /* smooth-zoom.css */
        /* 遮罩层 (背景) */
        .zoom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            z-index: 9998;
        }
        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
            cursor: zoom-out;
        }
        /* 正在放大的克隆图片 */
        .zoom-clone {
            position: fixed;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: zoom-out;
            border: 8px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        /* 原图在被点击时的样式，可选 */
        .post-img-zooming {
            opacity: 0 !important;
        }
    </style>
  
  </head>

    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');
        if (localStorage.getItem('theme') === 'dark' || 
                (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.classList.add('dark-theme');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            if (body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                localStorage.setItem('theme', 'light');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });

        /* smooth-zoom init: see js/smooth-zoom-js */
    </script>

    <script src="js/smooth-zoom-js"></script>

    <div class="svg-filter-container" aria-hidden="true">
        <svg width="0" height="0">
            <filter id="lg-dist">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2" stitchTiles="stitch" />
                <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </svg>
