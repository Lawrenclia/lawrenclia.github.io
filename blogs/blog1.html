<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>芝士博客 · Lawrenclia</title> 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * { 
        box-sizing: border-box; 
    }
    :root {
      --accent: #ff6b9a;
      --background: #f5e8ff; 
      --text: #111;
      --card-bg: #fff;
      --card-shadow: 0 6px 16px rgba(16,24,40,0.06);
      --muted: #666;
      --border: rgba(0,0,0,0.08);
      --link: #0066cc;

      /* 导航栏专属变量 */
      --nav-bg: rgba(255, 255, 255, 0.6);
      --nav-text: #1d1d1f;
      --nav-link-hover-bg: rgba(0, 0, 0, 0.03);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --nav-hover-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* 深色主题变量 */
    .dark-theme {
      --background: #1a1a1a;
      --text: #f0f0f0;
      --card-bg: #2d2d2d;
      --card-shadow: 0 6px 16px rgba(0,0,0,0.3);
      --muted: #bbb;
      --border: rgba(255,255,255,0.1);
      --link: #66b2ff;

      /* 导航栏专属变量 */
      --nav-bg: rgba(30, 30, 30, 0.7);
      --nav-text: #f0f0f0;
      --nav-link-hover-bg: rgba(255, 255, 255, 0.05);
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      --nav-hover-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    body{
      margin:0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:var(--background);
      color:var(--text);
      line-height:1.6;
      transition: background-color 0.3s ease;
    }
    /* =========================
        2. 顶部导航栏 
    ========================= */
    .navbar{
        height: 54px;
        display:flex;
        align-items:center;
        justify-content:center;
        position:fixed; 
        top:16px; 
        left:50%; 
        transform:translateX(-50%);
        z-index:30; 
        width:min(800px,calc(100% - 40px));
        background: rgba(255, 255, 255, 0.6);
        border-radius: 18px;
        padding: 0 28px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border:1px solid var(--border);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
        overflow: hidden;
    }

    .dark-theme .navbar {
        background: rgba(30, 30, 30, 0.7);
    }

    .navbar:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .dark-theme .navbar:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .nav-left{display:flex;align-items:center;gap:12px;margin-right: auto;}
    .brand{
        font-weight:600; 
        font-size:20px; 
        letter-spacing:0.2px;
        color: var(--text);
        display:flex; 
        align-items:center; 
        gap:10px;
    }
    .brand .logo{
        width:28px;
        height:28px;
        border-radius:8px; 
        background: var(--accent);
        display:inline-grid;
        place-items:center;
        font-weight:600;
        color:#fff;
        font-size:14px;
        box-shadow: 0 2px 10px rgba(255, 107, 154, 0.3);
    }
    .nav-center{
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .nav-link{
        padding:8px 12px; 
        border-radius:10px; 
        font-weight:400;
        font-size:14px; 
        color: var(--muted);
        text-decoration:none; 
        transition: all .2s ease;
        position: relative;
        overflow: hidden;
    }
    .nav-link:hover{ 
        color:var(--text); 
        background: rgba(255, 232, 232, 0.03);
        transform: translateY(-1px);
    }

    .dark-theme .nav-link:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .nav-link::after {
        content: '';
        position: absolute;
        bottom: 6px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--accent);
        transition: all 0.3s ease;
        transform: translateX(-50%);
    }
    .nav-link:hover::after {
        width: 60%;
    }
    .theme-toggle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    .theme-toggle:hover {
        background: rgba(0, 0, 0, 0.05);
        transform: rotate(90deg);
    }

    .dark-theme .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    .wrap {
      max-width: 800px; 
      margin: 80px auto 40px auto;
      padding: 0 20px;
    }

    article {
      background: var(--card-bg);
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
    }
    
    /* =========================
        博客卡片样式 (blog.html用)
    ========================= */
    .blog-card {
        display: flex;
        padding: 0;
        overflow: hidden;
    }
    .blog-card-image-link {
        flex-shrink: 0;
        display: block;
    }
    .blog-card-image {
        width: 220px;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }
    .blog-card-image-link:hover .blog-card-image {
        transform: scale(1.05);
    }
    .blog-card-content {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        padding: 24px;
    }
    .blog-card-content h2 {
        margin-top: 0;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 22px;
    }
    .blog-card-content h2 a {
        color: inherit;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .blog-card-content h2 a:hover {
        color: var(--accent);
    }
    .blog-card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
    }
    .blog-card-tags span {
        background: rgba(255, 107, 154, 0.1);
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 8px;
    }
    .blog-card-description {
        margin: 0 0 16px 0;
        flex-grow: 1;
        color: var(--muted);
    }
    .blog-card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 13px;
        color: var(--muted);
    }
    .blog-card-meta span {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* =========================
        新：博客文章详情页样式
    ========================= */
    .blog-post {
        padding: 32px 40px; /* 内部留白 */
    }
    .blog-post h1 {
        font-size: 32px;
        margin-top: 0;
        margin-bottom: 16px;
        color: var(--text);
    }
    /* 重用卡片元数据和标签样式 */
    .blog-post .blog-card-meta {
        font-size: 14px;
        margin-bottom: 16px;
    }
    .blog-post .blog-card-tags {
        margin-bottom: 24px;
    }

    .blog-post-image {
        width: 100%;
        height: auto;
        max-height: 400px; /* 限制最大高度 */
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 24px;
    }

    .blog-post-content {
        font-size: 16px;
        line-height: 1.7;
        color: var(--text);
    }
    .blog-post-content p {
        margin-top: 0;
        margin-bottom: 1.2em;
    }
    
    .back-link {
        display: inline-block;
        margin-top: 24px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: transform 0.2s ease;
    }
    .back-link:hover {
        transform: translateX(-4px);
    }


    /* =========================
        8. 响应式适配
    ========================= */
    @media (max-width: 600px) {
        /* ... (已有样式) ... */
        .card { max-width: 90vw; padding: 24px; border-radius: 24px; }
        .avatar { width: 90px; height: 90px; }
        .navbar { padding: 0 10px; height: 48px; }
        .nav-center { gap: 8px; }
        .brand div:first-of-type + div { font-size: 11px; }
        .nav-link { font-size: 11px; padding: 6px 6px; }
        .status-message h2 { font-size: 18px; }
        .status-message h3 { font-size: 14px; }
        footer { font-size: 12px; }

        /* 卡片响应式 */
        .blog-card {
            flex-direction: column;
        }
        .blog-card-image {
            width: 100%;
            height: 180px;
        }
        .blog-card-content {
            padding: 20px;
        }

        /* 新：文章详情页响应式 */
        .blog-post {
            padding: 24px;
        }
        .blog-post h1 {
            font-size: 26px;
        }
        .blog-post-content {
            font-size: 15px;
        }
    }
  </style>
</head>
<body>
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <div style="font-size:16px;font-weight:600">博客 · Lawrenclia</div>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <a class="nav-link" href="../index">首页</a>
            <a class="nav-link" href="../projects">项目</a>
            <a class="nav-link" href="../message">留言</a>
            <a class="nav-link" href="../about">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

  <div class="wrap">
    
    <article class="blog-post">
        
        <h1>芝士博客</h1>

        <div class="blog-card-meta">
          <span>
            <i class="fas fa-user"></i>
            Lawrenclia
          </span>
          <span>
            <i class="fas fa-calendar-alt"></i>
            10/2/2025
          </span>
        </div>

        <div class="blog-card-tags">
          <span>个人</span>
          <span>随笔</span>
        </div>

       <!-- <img src="../images/blog1.jpg" alt="blog1" class="blog-card-image"> -->

        <div class="blog-post-content">
            <h2>咕咕嘎嘎</h2>
        </div>

        <a href="../blog.html" class="back-link">&larr; 返回博客列表</a>

    </article>

  </div>

  <script>
    // 主题切换功能
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    
    // 检查本地存储中的主题偏好
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
  </script>

</body>
</html>
