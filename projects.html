<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>项目 · Lawrenclia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">

  <style>
    :root {
      --background: linear-gradient(90deg, #e5feff 0%, #bde6ff 100%);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      padding: 40px 20px;
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      text-decoration: none;
      color: #111;
    }
    
    .item h3 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
      color: #111;
    }

    .item p {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .item:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }
    
    .dark-theme .item {
      background: rgba(50, 50, 50, 0.4); /* 深色卡片背景：深灰半透明 */
      border: 1px solid rgba(255, 255, 255, 0.15); /* 深色边框：白色半透明（更淡） */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); /* 深色阴影：更浓，增强层次感 */
      color: var(--text); /* 继承深色模式文字色：#f0f0f0（白色） */
    }

    .dark-theme .item h3 {
      color: var(--text); /* 深色标题：白色 */
    }

    .dark-theme .item p {
      color: var(--muted); /* 深色描述：浅灰色（继承 --muted: #bbb） */
    }

    /* 深色模式下卡片 hover 效果（可选，增强交互） */
    .dark-theme .item:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); /* 深色 hover 阴影：更浓 */
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <div style="font-size:16px;font-weight:600">项目 · Lawrenclia</div>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="blog.html">博客</a>
            <!-- <a class="nav-link" href="construct"></a>
            <a class="nav-link" href="construct">画廊</a> -->
            <a class="nav-link" href="message.html">留言</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
  <div class="wrap">
    <div class="grid">
      <a class="item" href="https://github.com/Lawrenclia/CS1604" target="_blank">
        <h3>CS1604课程相关项目</h3>
        <p>这是一个关于SJTU-CS1604课程的项目</p>
      </a>
      <a class="item" href="https://github.com/Lawrenclia/CS1605" target="_blank">
        <h3>CS1605课程相关项目</h3>
        <p>这是一个关于SJTU-CS1605课程的项目</p>
      </a>
      <a class="item" href="https://github.com/Lawrenclia/ICE2607" target="_blank">
        <h3>ICE2607课程相关项目</h3>
        <p>这是一个关于SJTU-ICE2607课程的项目</p>
      </a>
      <a class="item" href="https://github.com/Lawrenclia/CS2602" target="_blank">
        <h3>CS2602课程相关项目</h3>
        <p>这是一个关于SJTU-CS2602课程的项目</p>
      </a>
    </div>
  </div>

  <script>
    // 主题切换功能
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    
    // 检查本地存储中的主题偏好
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
  </script>
  <svg width="0" height="0" style="position: absolute;">
      <filter id="lg-dist">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2" stitchTiles="stitch" />
        <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

</body>
</html>
