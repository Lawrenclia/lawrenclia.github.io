<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>留言 · Lawrenclia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
  <link rel="stylesheet" href="css/common.css">
  
  <style>
    :root {
        --background: linear-gradient(90deg, #efffe8 0%, #e6faff 100%);
    }
    /* 留言板专属样式 */
    .guestbook-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .guestbook-header h2 {
        margin: 0;
        color: var(--text);
        font-size: 24px;
    }
    #leave-message-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    #leave-message-btn:hover {
        background: #e65a88;
    }
    .disclaimer {
        background-color: var(--disclaimer-bg);
        border: 1px solid var(--disclaimer-border);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        color: var(--disclaimer-text);
        font-size: 14px;
    }
    .message-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .message-item {
        /* === 修改：应用液态玻璃样式 === */
        background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
        backdrop-filter: blur(3px) url(#lg-dist) saturate(var(--saturation)); 
        -webkit-backdrop-filter: blur(3px) url(#lg-dist) saturate(var(--saturation));
        border: none;
        box-shadow: 
          inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 10%), transparent),
          inset 1.8px 3px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 90%), transparent), 
          inset -2px -2px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 80%), transparent), 
          inset -3px -8px 1px -6px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 60%), transparent), 
          inset -0.3px -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 12%), transparent), 
          inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent), 
          inset 0px 3px 4px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent), 
          inset 2px -6.5px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent), 
          0px 1px 5px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent), 
          0px 6px 16px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 8%), transparent);
        /* === /液态玻璃样式 === */

        border-radius: 16px;
        padding: 20px;
        display: flex;
        gap: 15px;
        position: relative;
        padding-bottom: 40px;
        transition: 
          background-color 400ms cubic-bezier(1, 0.0, 0.4, 1),
          box-shadow 400ms cubic-bezier(1, 0.0, 0.4, 1),
          transform 0.3s ease;
    }
    
    .message-item:hover {
        transform: scale(1.03); /* 添加放大效果 */
    }

    .message-number {
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        flex-shrink: 0;
        line-height: 1;
    }
    .message-details {
        flex-grow: 1;
        position: relative;
    }
    .message-text {
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        margin-top: 0;
    }
    .message-author {
        position: absolute;
        right: 0;
        bottom: -5px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        padding: 5px 10px;
        /* 修改：背景继承父元素（玻璃），或设为透明 */
        background: transparent; 
        border-radius: 8px 0 16px 0;
    }

    /* 弹窗样式 */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
    }
    .modal-overlay.visible {
        opacity: 1;
        visibility: visible;
    }
    .modal-content {
        /* === 修改：应用液态玻璃样式 === */
        background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
        backdrop-filter: blur(3px) url(#lg-dist) saturate(var(--saturation)); 
        -webkit-backdrop-filter: blur(3px) url(#lg-dist) saturate(var(--saturation));
        border: none;
        box-shadow: 
          inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 10%), transparent),
          inset 1.8px 3px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 90%), transparent), 
          inset -2px -2px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 80%), transparent), 
          inset -3px -8px 1px -6px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 60%), transparent), 
          inset -0.3px -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 12%), transparent), 
          inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent), 
          inset 0px 3px 4px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent), 
          inset 2px -6.5px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent), 
          0px 1px 5px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent), 
          0px 6px 16px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 8%), transparent);
        /* === /液态玻璃样式 === */
        
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 500px;
        transform: scale(0.95);
        transition: 
          transform 0.3s,
          background-color 400ms cubic-bezier(1, 0.0, 0.4, 1),
          box-shadow 400ms cubic-bezier(1, 0.0, 0.4, 1);
    }
    .modal-overlay.visible .modal-content {
        transform: scale(1);
    }
    .modal-content h3 {
        margin-top: 0;
        margin-bottom: 16px;
        color: var(--text);
    }
    
    /* === 修改：调整输入框在玻璃上的样式 === */
    .modal-content input[type="text"],
    .modal-content textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.3); /* 亮色半透明背景 */
        color: var(--text);
    }
    
    .dark-theme .modal-content input[type="text"],
    .dark-theme .modal-content textarea {
        background: rgba(0, 0, 0, 0.2); /* 暗色半透明背景 */
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-content input[type="text"]::placeholder,
    .modal-content textarea::placeholder {
        color: var(--muted);
        opacity: 0.8;
    }
    .modal-content textarea {
        min-height: 120px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
    }
    .modal-actions {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
    }
    .modal-actions button {
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    #cancel-btn {
        background: var(--cancel-btn-bg);
        color: var(--cancel-btn-text);
    }
    #cancel-btn:hover {
        background: var(--cancel-btn-hover);
    }
    #submit-btn {
        background: var(--accent);
        color: #fff;
    }


  </style>
</head>

<body>
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <div style="font-size:16px;font-weight:600">留言 · Lawrenclia</div>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="projects.html">项目</a>
            <a class="nav-link" href="blog.html">博客</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
  
  <div class="wrap">
    <div class="guestbook-header">
      <h2>留言板</h2>
      <button id="leave-message-btn">写留言</button>
    </div>
    
    <div class="disclaimer">
      <strong>注意：</strong>本留言板后端已升级为 Supabase 平台。请勿发布任何违法、违规或不当内容。感谢您的理解与支持喵！
    </div>

    <div class="message-container" id="message-list">
      </div>
  </div>


  <div class="modal-overlay" id="message-modal">
    <div class="modal-content">
      <h3>写下你的留言</h3>
      <input type="text" id="author-input" placeholder="你的名字（选填）">
      <textarea id="message-input" placeholder="在这里输入..."></textarea>
      <div class="modal-actions">
        <button id="cancel-btn">取消</button>
        <button id="submit-btn">提交</button>
      </div>
    </div>
  </div>

  <script>
  // Supabase 配置
  const SUPABASE_URL = 'https://glphhykfjhuwltgfwqyw.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdscGhoeWtmamh1d2x0Z2Z3cXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5MDA1NjEsImV4cCI6MjA3NDQ3NjU2MX0.QkatvzOsTZ0l9i_rS6MesgeOiS5Lw6eEjzS-INBCU-c';

  // 初始化 Supabase 客户端
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', () => {
    const leaveMessageBtn = document.getElementById('leave-message-btn');
    const modal = document.getElementById('message-modal');
    const cancelBtn = document.getElementById('cancel-btn');
    const submitBtn = document.getElementById('submit-btn');
    const authorInput = document.getElementById('author-input');
    const messageInput = document.getElementById('message-input');
    const messageList = document.getElementById('message-list');

    // 初始化时加载留言
    loadMessages();

    leaveMessageBtn.addEventListener('click', () => {
      modal.classList.add('visible');
    });

    function closeModal() {
      modal.classList.remove('visible');
    }
    cancelBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // 提交留言逻辑
    submitBtn.addEventListener('click', async () => {
      const authorName = authorInput.value.trim() || '匿名';
      const messageText = messageInput.value.trim();
      
      if (messageText) {
        submitBtn.textContent = '提交中...';
        submitBtn.disabled = true;

        const { error } = await supabase
          .from('messages')
          .insert([{ author: authorName, content: messageText }]);

        submitBtn.textContent = '提交';
        submitBtn.disabled = false;

        if (error) {
          alert('提交失败: ' + error.message);
          console.error('Submission Error:', error);
        } else {
          authorInput.value = '';
          messageInput.value = '';
          closeModal();
          loadMessages(); 
        }
      } else {
        alert('留言内容不能为空！');
      }
    });

    // 加载留言逻辑
    async function loadMessages() {
      messageList.innerHTML = '<div style="text-align:center; color:var(--muted);">留言加载中...</div>';

      const { data: messages, error } = await supabase
        .from('messages')
        .select('author, content, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Loading Error:', error);
        messageList.innerHTML = '<div style="text-align:center; color:var(--accent);">留言加载失败，请检查API配置。</div>';
        return;
      }

      messageList.innerHTML = '';
      if (messages.length === 0) {
        messageList.innerHTML = '<div style="text-align:center; color:var(--muted);">暂无留言，快来写下第一条吧！</div>';
        return;
      }

      messages.forEach((msg, index) => {
        const sequenceNumber = messages.length - index; 
        addMessage(sequenceNumber, msg.author, msg.content);
      });
    }

    function addMessage(sequenceNumber, author, text) {
      const messageId = String(sequenceNumber).padStart(3, '0');
      
      const messageItem = document.createElement('div');
      messageItem.className = 'message-item';
      
      messageItem.innerHTML = `
        <div class="message-number">#${messageId}</div>
        <div class="message-details">
          <div class="message-text">${escapeHTML(text)}</div>
          <div class="message-author">—— ${escapeHTML(author)}</div> 
        </div>
      `;
      messageList.appendChild(messageItem);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(match) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[match];
      });
    }
  });

  // 主题切换功能
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    
    // 检查本地存储中的主题偏好
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });

    // 监听系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) { // 只有在用户没有手动设置主题时才响应系统变化
        if (e.matches) {
          body.classList.add('dark-theme');
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        } else {
          body.classList.remove('dark-theme');
          icon.classList.remove('fa-sun');
          icon.classList.add('fa-moon');
        }
      }
    });
</script>
<svg width="0" height="0" style="position: absolute;">
      <filter id="lg-dist">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2" stitchTiles="stitch" />
        <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

</body>
</html>
