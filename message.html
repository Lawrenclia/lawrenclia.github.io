<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>留言 · Lawrenclia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
  <link rel="stylesheet" href="css/style.css?v=20260713-theme">
  
  <script src="js/theme-transition.js" defer></script>
  </head>
<body class="page-message">
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>
                留言 · Lawrenclia
            </div>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="projects.html">项目</a>
            <a class="nav-link" href="notes.html">笔记</a>
            <a class="nav-link" href="about.html">关于</a>
            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
  
  <div class="wrap">
    <div class="guestbook-header">
      <h2>留言板</h2>
      <button id="leave-message-btn">写留言</button>
    </div>
    
    <div class="disclaimer">
      <strong>提示：</strong>此功能坏了喵，请勿留言喵，懒了！
      <!-- <strong>注意：</strong>请勿发布任何违法、违规或不当内容。感谢您的理解与支持喵！ -->
    </div>

    <div class="message-container" id="message-list">
      </div>
  </div>


  <div class="modal-overlay" id="message-modal">
    <div class="modal-content">
      <h3>写下你的留言</h3>
      <input type="text" id="author-input" placeholder="你的名字（选填）">
      <textarea id="message-input" placeholder="在这里输入..."></textarea>
      <div class="modal-actions">
        <button id="cancel-btn">取消</button>
        <button id="submit-btn">提交</button>
      </div>
    </div>
  </div>

  <script>
  const SUPABASE_URL = 'https://glphhykfjhuwltgfwqyw.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdscGhoeWtmamh1d2x0Z2Z3cXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5MDA1NjEsImV4cCI6MjA3NDQ3NjU2MX0.QkatvzOsTZ0l9i_rS6MesgeOiS5Lw6eEjzS-INBCU-c';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.addEventListener('DOMContentLoaded', () => {
    const leaveMessageBtn = document.getElementById('leave-message-btn');
    const modal = document.getElementById('message-modal');
    const cancelBtn = document.getElementById('cancel-btn');
    const submitBtn = document.getElementById('submit-btn');
    const authorInput = document.getElementById('author-input');
    const messageInput = document.getElementById('message-input');
    const messageList = document.getElementById('message-list');
    loadMessages();
    leaveMessageBtn.addEventListener('click', () => {
      modal.classList.add('visible');
    });
    function closeModal() {
      modal.classList.remove('visible');
    }
    cancelBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
    submitBtn.addEventListener('click', async () => {
      const authorName = authorInput.value.trim() || '匿名';
      const messageText = messageInput.value.trim();
      if (messageText) {
        submitBtn.textContent = '提交中...';
        submitBtn.disabled = true;
        const { error } = await supabase
          .from('messages')
          .insert([{ author: authorName, content: messageText }]);
        submitBtn.textContent = '提交';
        submitBtn.disabled = false;
        if (error) {
          alert('提交失败: ' + error.message);
          console.error('Submission Error:', error);
        } else {
          authorInput.value = '';
          messageInput.value = '';
          closeModal();
          loadMessages(); 
        }
      } else {
        alert('留言内容不能为空！');
      }
    });
    async function loadMessages() {
      messageList.innerHTML = '<div style="text-align:center; color:var(--muted);">留言加载中...</div>';
      const { data: messages, error } = await supabase
        .from('messages')
        .select('author, content, created_at')
        .order('created_at', { ascending: false });
      if (error) {
        console.error('Loading Error:', error);
        messageList.innerHTML = '<div style="text-align:center; color:var(--accent);">留言加载失败，请检查API配置。</div>';
        return;
      }
      messageList.innerHTML = '';
      if (messages.length === 0) {
        messageList.innerHTML = '<div style="text-align:center; color:var(--muted);">暂无留言，快来写下第一条吧！</div>';
        return;
      }
      messages.forEach((msg, index) => {
        const sequenceNumber = messages.length - index; 
        addMessage(sequenceNumber, msg.author, msg.content);
      });
    }
    function addMessage(sequenceNumber, author, text) {
      const messageId = String(sequenceNumber).padStart(3, '0');
      const messageItem = document.createElement('div');
      messageItem.className = 'message-item';
      messageItem.innerHTML = `
        <div class="message-number">#${messageId}</div>
        <div class="message-details">
          <div class="message-text">${escapeHTML(text)}</div>
          <div class="message-author">—— ${escapeHTML(author)}</div> 
        </div>
      `;
      messageList.appendChild(messageItem);
    }
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(match) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[match];
      });
    }
  });
  const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        if (e.matches) {
          body.classList.add('dark-theme');
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        } else {
          body.classList.remove('dark-theme');
          icon.classList.remove('fa-sun');
          icon.classList.add('fa-moon');
        }
      }
    });
</script>

</body>
</html>
