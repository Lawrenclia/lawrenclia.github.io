<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ · Lawrenclia Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="$site-css-path$?v=20260715-refresh">
  <link rel="stylesheet" href="$css-path$?v=20260715-refresh">
  <link rel="stylesheet" href="../../css/macos-pages.css?v=20260723-macos-v5">
  <script>
    const mathDollar = String.fromCharCode(36);
    window.MathJax = {
      tex: {
        inlineMath: [[mathDollar, mathDollar], ['\\(', '\\)']],
        displayMath: [[mathDollar + mathDollar, mathDollar + mathDollar], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="../../js/macos-pages.js?v=20260723-macos-v5"></script>
  <script defer src="../../js/notes-reader.js?v=20260723-macos-v5"></script>
</head>
<body class="macos-page page-note-reader">
  <header class="page-menubar">
    <a class="page-brand" href="../../index.html" aria-label="返回主页">
      <span class="page-brand-mark">L</span>
      <strong>Lawrenclia</strong>
      <span class="page-context">Notes Reader</span>
    </a>
    <span class="page-dock-divider" aria-hidden="true"></span>
    <nav class="page-nav" aria-label="主导航">
      <a href="../../projects.html"><i data-lucide="folder" aria-hidden="true"></i><span>项目</span></a>
      <a href="../../notes.html"><i data-lucide="book-open" aria-hidden="true"></i><span>笔记</span></a>
      <a href="../../about.html"><i data-lucide="user-round" aria-hidden="true"></i><span>关于</span></a>
    </nav>
    <div class="page-status">
      <span class="page-date" data-current-date></span>
      <button class="page-theme-button" type="button" data-theme-toggle aria-label="切换主题">
        <i data-lucide="moon" data-theme-icon aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <button class="toc-toggle" type="button" aria-label="打开目录" aria-controls="toc-panel" aria-expanded="false">
    <i data-lucide="list" aria-hidden="true"></i>
  </button>
  <div class="toc-backdrop" hidden></div>

  <div class="layout">
    <header class="reader-titlebar">
      <span class="mac-traffic-lights" aria-hidden="true"><span></span><span></span><span></span></span>
      <div class="mac-title"><i data-lucide="file-text" aria-hidden="true"></i><span>$title$</span></div>
      <span class="mac-titlebar-spacer"></span>
    </header>
    <aside id="toc-panel" class="toc-panel">
      <h1>目录</h1>
      <p>$title$</p>
      <nav>
$toc$
      </nav>
    </aside>
    <main>
      <div class="hero">
        <h1>$title$</h1>
      </div>
$body$
    </main>
  </div>
</body>
</html>
