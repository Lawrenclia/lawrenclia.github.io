<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ · Lawrenclia Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="$site-css-path$">
  <link rel="stylesheet" href="$css-path$">
  <script>
    const mathDollar = String.fromCharCode(36);
    window.MathJax = {
      tex: {
        inlineMath: [[mathDollar, mathDollar], ['\\(', '\\)']],
        displayMath: [[mathDollar + mathDollar, mathDollar + mathDollar], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="navbar" role="navigation" aria-label="主导航">
    <div class="nav-left">
      <div class="brand" aria-hidden>
        笔记 · Lawrenclia
      </div>
    </div>
    <div class="nav-right">
      <a class="nav-link" href="../../index.html">首页</a>
      <a class="nav-link" href="../../projects.html">项目</a>
      <a class="nav-link" href="../../notes.html">笔记</a>
      <a class="nav-link" href="../../about.html">关于</a>
      <button class="theme-toggle" aria-label="切换主题">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <h1>$title$</h1>
      <p>课程笔记</p>
      <nav>
$toc$
      </nav>
    </aside>
    <main>
      <div class="hero">
        <h1>$title$</h1>
      </div>
$body$
    </main>
  </div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');

    function updateThemeIcon() {
      if (body.classList.contains('dark-theme')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    }

    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
    }
    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      localStorage.setItem('theme', body.classList.contains('dark-theme') ? 'dark' : 'light');
      updateThemeIcon();
    });
  </script>
</body>
</html>
