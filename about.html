<body class="page-about">
  <header class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-left">
            <div class="brand" aria-hidden>

            <button class="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
    
  <main class="wrap">
    <div class="about-shell">
      <aside class="about-profile">
        <img class="about-avatar" src="images/avatar.png" alt="Lawrenclia 的头像">
        <h1>Lawrenclia</h1>
        <p>C++ / Python / C#</p>
        <div class="about-links">
          <a href="https://github.com/Lawrenclia" target="_blank" rel="noopener"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
        </div>
      </aside>

      <div class="about-content">
        <section class="about-panel">
          <h2>关于我</h2>
          <p>主要使用 C++ 和 Python，正在学习 Unity 与 C#，也在继续打好数据结构和算法基础。</p>
          <p>参与制作了游戏《即时象棋》，可以在 Steam 搜索。</p>

        <section class="about-panel">
          <h2>技术</h2>
          <ul class="skill-list">
            <li>C++</li>
            <li>Python</li>
            <li>C#</li>
            <li>Unity</li>
            <li>数据结构</li>
            <li>算法</li>

        <section class="about-panel">

      </div>
    </div>
  </main>

  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;
    const icon = themeToggle.querySelector('i');
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark-theme');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    });
  </script>

  </body>
</html>
